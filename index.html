<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Penguin's Bday</title>

  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg1:#ff7aa8;
      --bg2:#ffc2d6;
      --bg3:#bda7ff;

      --primary:#ff3d7f;
      --primary2:#ff66a6;

      --glass: rgba(255,255,255,0.22);
      --glass2: rgba(255,255,255,0.14);
      --border: rgba(255,255,255,0.35);

      --text: rgba(255,255,255,0.96);

      --shadow: 0 18px 60px rgba(0,0,0,0.18);
      --shadow2: 0 10px 28px rgba(0,0,0,0.16);

      --radius: 26px;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      min-height:100vh;
      overflow-x:hidden;
      font-family:'Outfit', sans-serif;
      color:var(--text);
      display:flex;
      flex-direction:column;
      align-items:center;
      padding: 26px 0 46px;
      position:relative;

      background: radial-gradient(1200px 700px at 20% 15%, rgba(255,255,255,0.35), transparent 55%),
                  radial-gradient(900px 600px at 85% 25%, rgba(255,255,255,0.22), transparent 60%),
                  linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3));
      background-size: 100% 100%, 100% 100%, 300% 300%;
      animation: gradientBG 14s ease infinite;
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      background:
        radial-gradient(2px 2px at 15% 20%, rgba(255,255,255,.9), transparent 60%),
        radial-gradient(2px 2px at 35% 75%, rgba(255,255,255,.7), transparent 60%),
        radial-gradient(2px 2px at 70% 30%, rgba(255,255,255,.8), transparent 60%),
        radial-gradient(1.5px 1.5px at 85% 70%, rgba(255,255,255,.6), transparent 60%),
        radial-gradient(1.5px 1.5px at 55% 45%, rgba(255,255,255,.65), transparent 60%);
      opacity:.55;
      filter: blur(.2px);
    }

    @keyframes gradientBG{
      0%{ background-position: 0 0, 0 0, 0% 50%; }
      50%{ background-position: 0 0, 0 0, 100% 50%; }
      100%{ background-position: 0 0, 0 0, 0% 50%; }
    }

    h1{
      font-family:'Playfair Display', serif;
      font-size: clamp(1.8rem, 3.8vw, 2.35rem);
      margin: 10px 0 18px;
      letter-spacing: 0.2px;
      text-shadow: 0 10px 30px rgba(0,0,0,0.18);
      text-align:center;
      padding: 0 10px;
    }

    .glass-panel{
      width: 88%;
      max-width: 420px;
      margin-bottom: 18px;
      padding: 18px 16px;
      border-radius: var(--radius);

      background: linear-gradient(180deg, var(--glass), var(--glass2));
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      position:relative;
      overflow:hidden;
      text-align:center;
    }

    .glass-panel::before{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      background: linear-gradient(135deg, rgba(255,255,255,0.28), transparent 40%);
      opacity:.9;
    }

    .polaroid{
      padding: 12px;
      border-radius: 22px;
      background: rgba(255,255,255,0.82);
      box-shadow: var(--shadow2);
      position:relative;
      z-index:5;
    }

    .polaroid::after{
      content:"";
      position:absolute;
      left: 14px;
      right: 14px;
      bottom: 10px;
      height: 18px;
      border-radius: 10px;
      background: rgba(255,255,255,0.75);
      filter: blur(0.2px);
      opacity: 0.65;
    }

    .polaroid img{
      width:100%;
      height: 320px;
      object-fit:cover;
      border-radius: 16px;
      display:block;
      background: rgba(0,0,0,0.06);
    }

    #error-debug{
      color:#fff;
      background: rgba(255, 45, 114, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.35);
      padding: 10px 12px;
      font-size: 0.78rem;
      margin-top: 10px;
      display:none;
      border-radius: 14px;
      box-shadow: 0 10px 24px rgba(0,0,0,0.12);
      position: relative;
      z-index: 6;
      text-align:left;
      line-height: 1.35;
      word-break: break-word;
    }

    .scratch-box{
      position: relative;
      width: 100%;
      height: 160px;
      overflow: hidden;
      border-radius: 18px;
      margin-top: 14px;
      background: rgba(255,255,255,0.16);
      border: 1px solid rgba(255,255,255,0.28);
      box-shadow: 0 12px 28px rgba(0,0,0,0.10);
      z-index:5;
    }

    .hidden-text{
      position: absolute;
      inset: 0;
      display: block;
      padding: 16px 16px;
      font-style: italic;
      font-size: 1.02rem;
      line-height: 1.5;
      color: rgba(255,255,255,0.96);
      text-shadow: 0 8px 24px rgba(0,0,0,0.18);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      z-index: 1;
    }

    .hidden-text::-webkit-scrollbar{ width: 8px; }
    .hidden-text::-webkit-scrollbar-thumb{
      background: rgba(255,255,255,0.35);
      border-radius: 99px;
    }
    .hidden-text::-webkit-scrollbar-track{
      background: rgba(255,255,255,0.10);
      border-radius: 99px;
    }

    canvas{
      position:absolute;
      top:0; left:0;
      z-index:2;
      touch-action:none;
      border-radius: 18px;
    }

    canvas.disabled{
      pointer-events:none;
    }

    .hug-btn{
      margin-top: 14px;
      border: none;
      padding: 13px 28px;
      border-radius: 999px;
      font-weight: 700;
      letter-spacing: 0.2px;
      cursor:pointer;

      color: white;
      background: linear-gradient(135deg, var(--primary), var(--primary2));
      box-shadow: 0 14px 30px rgba(255, 61, 127, 0.28);
      transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
      position: relative;
      z-index: 6;
    }

    .hug-btn:hover{
      transform: translateY(-2px);
      filter: brightness(1.02);
      box-shadow: 0 18px 40px rgba(255, 61, 127, 0.34);
    }
    .hug-btn:active{
      transform: translateY(0px) scale(0.99);
    }

    .calendar-grid{
      display:grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 9px;
      margin-top: 12px;
      padding: 2px;
      position: relative;
      z-index: 6;
    }

    .day-bubble{
      aspect-ratio:1;
      border-radius: 999px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size: 0.8rem;
      font-weight: 700;
      cursor:pointer;
      user-select:none;

      background: rgba(255,255,255,0.86);
      color: rgba(255, 30, 90, 0.92);
      border: 1px solid rgba(255,255,255,0.6);
      box-shadow: 0 10px 22px rgba(0,0,0,0.10);

      transition: transform .18s ease, box-shadow .18s ease, background .18s ease, opacity .18s ease;
    }

    .day-bubble:hover{
      transform: translateY(-2px);
    }

    .day-bubble.active{
      background: linear-gradient(135deg, var(--primary), var(--primary2));
      color:white;
      border:none;
      box-shadow: 0 0 0 5px rgba(255,255,255,0.22), 0 18px 40px rgba(255, 61, 127, 0.35);
      transform: scale(1.08);
      z-index: 7;
    }

    h3{
      margin: 0 0 14px 0;
      font-size: 0.92rem;
      letter-spacing: 2px;
      font-weight: 500;
      color: rgba(255,255,255,0.82);
      position: relative;
      z-index: 6;
    }

    #days-left{
      margin-top: 18px;
      font-size: 0.82rem;
      opacity: 0.78;
      font-weight: 400;
      position: relative;
      z-index: 6;
    }

    #distance-tag{
      font-size: 0.78rem;
      opacity: 0.78;
      margin-top: 10px;
      font-weight: 400;
      text-shadow: 0 10px 24px rgba(0,0,0,0.14);
      position: relative;
      z-index: 6;
    }
  </style>
</head>

<body>
  <div id="main-app">
    <h1 id="date-title">Loading…</h1>

    <div class="glass-panel">
      <div class="polaroid">
        <img id="display-img" src="" alt="Loading..." />
      </div>

      <div id="error-debug"></div>

      <div class="scratch-box">
        <div class="hidden-text" id="display-msg"></div>
        <canvas id="scratch-canvas"></canvas>
      </div>

      <button class="hug-btn" id="hugBtn">Send Hug</button>
    </div>

    <div class="glass-panel" style="width: 92%; max-width: 420px;">
      <h3 style="margin: 0 0 15px 0; font-size: 0.9rem; opacity: 0.85; letter-spacing: 2px; font-weight: 500;">
        My Baby's Month
      </h3>
      <div class="calendar-grid" id="calendar-wrapper"></div>
      <div id="days-left"></div>
    </div>

    <div id="distance-tag"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>

  <script>
    // =========================
    // REQUIRED CONFIG
    // =========================
    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSKqWbkDWDomm_5dSZhriAHQAx3EG_jPrulurvlmkdlUl7XoF4pkz5KT-5JMHyauG_JbzQBDAYsdbuS/pub?gid=0&single=true&output=csv';

    // Your portal is for Feb 2026 (fixed archive)
    const PORTAL_YEAR = 2026;
    const PORTAL_MONTH = 2;   // February
    const PORTAL_DAYS = 28;

    // Forever mode: all unlocked always
    const ALWAYS_UNLOCKED = true;

    // Photo folder + default naming patterns (tries both)
    const PHOTO_FOLDER = "photos";
    const DEFAULT_EXTS = [".jpg.jpg", ".jpg", ".jpeg", ".png"];

    // =========================
    // State
    // =========================
    let allData = [];
    let dataReady = false;
    let selectedDay = 28; // default (birthday)
    let sgNowISO = null;

    // =========================
    // Helpers
    // =========================
    function $(id){ return document.getElementById(id); }

    function showDebug(html){
      const box = $("error-debug");
      box.style.display = "block";
      box.innerHTML = html;
    }
    function hideDebug(){
      const box = $("error-debug");
      box.style.display = "none";
      box.innerHTML = "";
    }

    function clamp(n, a, b){ return Math.max(a, Math.min(b, n)); }

    function getSingaporeISODateParts(){
      // Always use Singapore time
      const fmt = new Intl.DateTimeFormat("en-CA", {
        timeZone: "Asia/Singapore",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      });
      const iso = fmt.format(new Date()); // YYYY-MM-DD
      const [y,m,d] = iso.split("-").map(x => parseInt(x,10));
      return { iso, y, m, d };
    }

    function portalISOForDay(day){
      const dd = String(day).padStart(2,"0");
      return `${PORTAL_YEAR}-${String(PORTAL_MONTH).padStart(2,"0")}-${dd}`;
    }

    // Robust date normalization to YYYY-MM-DD
    // Note: ambiguous 2/2/2026 is assumed MM/DD/YYYY. If your sheet is DD/MM/YYYY, swap a/b.
    function normalizeToISODate(raw) {
      if (raw == null) return null;
      const s = String(raw).trim();
      if (!s) return null;

      // ISO-ish: 2026-02-02 or 2026/02/02
      const iso = s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})$/);
      if (iso) {
        const y = iso[1];
        const m = String(iso[2]).padStart(2, '0');
        const d = String(iso[3]).padStart(2, '0');
        return `${y}-${m}-${d}`;
      }

      // Slashed: 2/2/2026
      const sl = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
      if (sl) {
        const a = parseInt(sl[1], 10);
        const b = parseInt(sl[2], 10);
        const y = sl[3];

        // ASSUME MM/DD/YYYY (US). If DD/MM/YYYY, swap these two lines:
        const m = String(a).padStart(2, '0');
        const d = String(b).padStart(2, '0');

        return `${y}-${m}-${d}`;
      }

      // Fallback parse: "Feb 2, 2026"
      const dt = new Date(s);
      if (!isNaN(dt.getTime())) {
        const y = dt.getFullYear();
        const m = String(dt.getMonth() + 1).padStart(2, '0');
        const d = String(dt.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
      }

      return null;
    }

    function isAbsoluteURL(s){
      return /^https?:\/\//i.test(s) || /^data:/i.test(s);
    }

    function resolveImageCandidates(rawName, portalISO){
      // portalISO = "2026-02-14"
      // We will try:
      // 1) rawName if it is absolute URL or already includes folder
      // 2) PHOTO_FOLDER/rawName if it looks like a filename
      // 3) PHOTO_FOLDER/portalISO + ext variants
      const candidates = [];

      const clean = (rawName || "").toString().trim();

      if (clean){
        if (isAbsoluteURL(clean)) {
          candidates.push(clean);
        } else if (clean.startsWith(`${PHOTO_FOLDER}/`)) {
          candidates.push(clean);
        } else if (clean.includes("/") ) {
          // relative path like "assets/x.jpg" -> use as-is
          candidates.push(clean);
        } else {
          // looks like filename
          candidates.push(`${PHOTO_FOLDER}/${clean}`);
        }
      }

      // Default pattern:
      for (const ext of DEFAULT_EXTS){
        candidates.push(`${PHOTO_FOLDER}/${portalISO}${ext}`);
      }

      // de-dupe
      return [...new Set(candidates)];
    }

    function setImageWithFallback(imgEl, candidates){
      let idx = 0;

      function tryNext(){
        if (idx >= candidates.length){
          showDebug(
            `⚠️ <b>Image missing</b><br>
             Tried:<br><div style="opacity:.9; font-size:.75rem; margin-top:6px;">${candidates.map(c => `• ${c}`).join("<br>")}</div>`
          );
          return;
        }
        const src = candidates[idx++];
        imgEl.src = src;
      }

      imgEl.onerror = () => tryNext();
      tryNext();
    }

    // =========================
    // Data loading
    // =========================
    function loadData(){
      return new Promise((resolve, reject) => {
        if (typeof Papa === "undefined"){
          reject(new Error("PapaParse CDN did not load."));
          return;
        }

        const url = `${SHEET_URL}&cache=${Date.now()}`; // cache-buster
        Papa.parse(url, {
          download: true,
          header: true,
          skipEmptyLines: true,
          complete: function (results) {
            allData = (results.data || []).filter(r => {
              const d = (r.Date || r.date || "").toString().trim();
              const m = (r.Message || r.message || "").toString().trim();
              const i = (r.ImageName || r.imagename || "").toString().trim();
              return d || m || i;
            });
            dataReady = true;
            resolve();
          },
          error: function (err) {
            reject(err);
          }
        });
      });
    }

    function findRowForPortalDay(portalISO){
      // Match by normalized date against portal ISO date
      return allData.find(r => {
        const raw = (r.Date || r.date || "").toString();
        const iso = normalizeToISODate(raw);
        return iso === portalISO;
      });
    }

    // =========================
    // Render
    // =========================
    function renderCalendar(activeDay){
      const grid = $("calendar-wrapper");
      grid.innerHTML = "";

      for (let i = 1; i <= PORTAL_DAYS; i++) {
        const bubble = document.createElement("div");
        bubble.className = "day-bubble";
        bubble.textContent = i;

        if (i === activeDay) bubble.classList.add("active");

        bubble.addEventListener("click", () => {
          selectedDay = i;
          renderContent(i);
          renderCalendar(i);
        });

        grid.appendChild(bubble);
      }

      // Forever mode copy
      $("days-left").innerText = "All memories are unlocked. Tap any day.";
    }

    function renderContent(day){
      day = clamp(day, 1, PORTAL_DAYS);
      const portalISO = portalISOForDay(day);

      $("date-title").innerText = `February ${day}`;
      const imgEl = $("display-img");
      const msgEl = $("display-msg");

      // If data not ready, still show photo fallback + a helpful note
      if (!dataReady){
        showDebug(`⚠️ <b>Messages not loaded</b><br>
          The sheet could not be loaded right now, but photos can still work if present in <b>/${PHOTO_FOLDER}/</b>.<br>
          Expected default name: <b>${portalISO}.jpg.jpg</b> (or .jpg).`);

        const candidates = resolveImageCandidates("", portalISO);
        setImageWithFallback(imgEl, candidates);

        msgEl.innerText = "If you are reading this, the site is in offline mode. Your messages will appear when the sheet link works again.";
        initScratch();
        return;
      }

      // Data ready
      const row = findRowForPortalDay(portalISO);

      if (!row){
        // Show row mismatch diagnostics
        const sample = allData.slice(0, 6).map(r => (r.Date || r.date || "")).join(" | ");
        showDebug(`⚠️ <b>No row found</b><br>
          Could not find a sheet row for <b>${portalISO}</b>.<br><br>
          <b>Quick debug</b><br>
          rows loaded = ${allData.length}<br>
          sample dates = ${sample}<br><br>
          Fix: ensure the sheet Date column matches <b>YYYY-MM-DD</b> for Feb 2026.`);
        // still attempt photo fallback
        const candidates = resolveImageCandidates("", portalISO);
        setImageWithFallback(imgEl, candidates);
        msgEl.innerText = "Sheet date mismatch. Fix the Date column to YYYY-MM-DD (Singapore).";
        initScratch();
        return;
      }

      hideDebug();

      const rawMsg = (row.Message || row.message || row.MESSAGE || "").toString();
      msgEl.innerText = rawMsg || "No message found for this day (Message column empty).";

      const rawName = (row.ImageName || row.imagename || row.IMAGE || "").toString().trim();
      const candidates = resolveImageCandidates(rawName, portalISO);
      setImageWithFallback(imgEl, candidates);

      initScratch();
    }

    // =========================
    // Scratch (reliable + scroll unlock)
    // =========================
    function initScratch(){
      const canvas = $("scratch-canvas");
      const ctx = canvas.getContext("2d");
      const parent = canvas.parentElement;

      // Set size based on rendered layout
      canvas.width = Math.max(10, parent.clientWidth);
      canvas.height = Math.max(10, parent.clientHeight);

      canvas.classList.remove("disabled");
      ctx.globalCompositeOperation = "source-over";

      const grd = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
      grd.addColorStop(0, "#ffd1e3");
      grd.addColorStop(1, "#ff5fa2");
      ctx.fillStyle = grd;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "white";
      ctx.font = "bold 14px Outfit";
      ctx.textAlign = "center";
      ctx.fillText("SCRATCH TO READ", canvas.width / 2, canvas.height / 2 + 5);

      ctx.globalCompositeOperation = "destination-out";

      let isDown = false;

      function getXY(e){
        const rect = canvas.getBoundingClientRect();
        const clientX = (e.touches && e.touches[0]) ? e.touches[0].clientX : e.clientX;
        const clientY = (e.touches && e.touches[0]) ? e.touches[0].clientY : e.clientY;
        return { x: clientX - rect.left, y: clientY - rect.top };
      }

      function scratchAt(e){
        const { x, y } = getXY(e);
        ctx.beginPath();
        ctx.arc(x, y, 26, 0, Math.PI * 2);
        ctx.fill();
      }

      function maybeDisableCanvas(){
        // expensive but only runs on end
        const img = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
        let transparent = 0;
        for (let i = 3; i < img.length; i += 4) {
          if (img[i] === 0) transparent++;
        }
        const ratio = transparent / (img.length / 4);

        if (ratio > 0.45){
          canvas.classList.add("disabled");
        }
      }

      // Mouse
      canvas.onmousedown = (e) => { isDown = true; scratchAt(e); };
      canvas.onmousemove = (e) => { if (!isDown) return; e.preventDefault(); scratchAt(e); };
      window.onmouseup = () => { if (isDown) { isDown = false; maybeDisableCanvas(); } };

      // Touch
      canvas.ontouchstart = (e) => { isDown = true; e.preventDefault(); scratchAt(e); };
      canvas.ontouchmove = (e) => { if (!isDown) return; e.preventDefault(); scratchAt(e); };
      canvas.ontouchend = () => { if (isDown) { isDown = false; maybeDisableCanvas(); } };
    }

    // Keep scratch correct on rotation/resizes
    let resizeTimer = null;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => initScratch(), 120);
    });

    // =========================
    // Hug effect
    // =========================
    function sendHug(){
      for (let i = 0; i < 15; i++){
        const h = document.createElement("div");
        h.innerText = "❤️";
        h.style.position = "fixed";
        h.style.left = "50%";
        h.style.top = "50%";
        h.style.transition = "2s";
        h.style.pointerEvents = "none";
        h.style.zIndex = "3000";
        document.body.appendChild(h);

        setTimeout(() => {
          h.style.transform = `translate(${(Math.random() - 0.5) * 400}px, ${(Math.random() - 0.5) * 600}px) scale(3) rotate(${Math.random() * 360}deg)`;
          h.style.opacity = "0";
        }, 10);

        setTimeout(() => h.remove(), 2000);
      }
    }

    function setDistanceTag(){
      $("distance-tag").innerText = "3997 KM apart, but together forever";
    }

    // =========================
    // Init
    // =========================
    async function init(){
      setDistanceTag();

      const { iso, y, m, d } = getSingaporeISODateParts();
      sgNowISO = iso;

      // Default day logic:
      // - If it's February (any year) and day <= 28: default to that day
      // - Else: default to day 28 (birthday)
      let defaultDay = 28;
      if (m === 2){
        defaultDay = clamp(d, 1, PORTAL_DAYS);
      }

      // Always unlocked forever; default day selection only affects initial view
      selectedDay = defaultDay;

      // Try load data (but site works even if this fails)
      try{
        await loadData();
        dataReady = true;
      }catch(e){
        dataReady = false;
        showDebug(`⚠️ <b>Sheet load failed</b><br>${String(e)}<br><br>
          The site will still work with photo fallbacks if your images exist in <b>/${PHOTO_FOLDER}/</b>.<br>
          Fix: ensure the Google Sheet is <b>Published to the web</b> and the URL is correct.`);
      }

      renderCalendar(selectedDay);
      renderContent(selectedDay);

      // Bind hug button
      $("hugBtn").addEventListener("click", sendHug);
    }

    init();
  </script>
</body>
</html>
